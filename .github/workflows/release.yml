# Publishing a release on GitHub builds the jar and attaches it to the release.
# The release's tag gives the version: tag v1.2.3 makes figwig-java-1.2.3.jar.
name: Release

on:
  release:
    types: [ published ]

jobs:
  jar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Version from the tag
      run: |
        case "$GITHUB_REF_NAME" in
          v[0-9]*) echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV" ;;
          *) echo "The release tag must look like v1.2.3, not $GITHUB_REF_NAME" >&2; exit 1 ;;
        esac
    - name: Test and build the jar
      run: ./gradlew build -PreleaseVersion="$RELEASE_VERSION"
    - name: Attach the jar to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "$GITHUB_REF_NAME" "build/libs/figwig-java-$RELEASE_VERSION.jar" --clobber
