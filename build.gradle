plugins {
    id 'java-library'
    id 'application'
}

group = 'org.figwig'
// A release build is given its version by the release workflow, from the release's tag.
version = findProperty('releaseVersion') ?: 'dev'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.json:json:20250517'
    testImplementation 'junit:junit:4.13.2'
}

application {
    mainClass = 'org.figwig.FigWigReader'
}

jar {
    manifest {
        attributes 'Implementation-Title': 'figwig', 'Implementation-Version': project.version
    }
}

test {
    maxHeapSize = '2g'
}
